spring.application.name=ticket-management

# TODO [MENTOR REVIEW]: Không để URL/username/password thật hoặc mặc định trong source.
# Chỉ đọc từ biến môi trường, bổ sung .env.example và cấu hình test database riêng để mvn test chạy độc lập.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ticket_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
